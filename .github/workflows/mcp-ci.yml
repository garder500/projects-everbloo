name: MCP CI

on:
  push:
    branches: [main]
    paths: ["metis/dev-agent-mcp/**", ".github/workflows/mcp-*.yml"]
  pull_request:
    paths: ["metis/dev-agent-mcp/**", ".github/workflows/mcp-*.yml"]

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: [dev-agent-mcp]
    defaults:
      run:
        working-directory: metis/${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        if: matrix.mcp == 'dev-agent-mcp'
        run: bunx tsc --noEmit
      - run: bun test
      - name: Build standalone binary
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mcp }}-linux
          path: metis/${{ matrix.mcp }}/dist/*
          retention-days: 7
