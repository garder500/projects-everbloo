name: MCP Release

# Tag `mcp-vX.Y.Z` → binaires multi-plateformes attachés à la release GitHub.
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcp: [dev-agent-mcp]
    defaults:
      run:
        working-directory: ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build toutes plateformes
        run: |
          bun run build:windows-x64
          bun run build:linux-x64
          bun run build:darwin-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.mcp }}/dist/${{ matrix.mcp }}-*
