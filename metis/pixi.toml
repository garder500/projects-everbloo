[workspace]
authors = ["garder500 <jeremy27.clara22@gmail.com>"]
channels = ["conda-forge"]
name = "metis"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
nodejs = ">=20,<25"
openjdk = ">=17"
git = "*"
make = "*" # Équivalent de gnumake sur Windows via conda
# gemini-cli n'est pas sur conda-forge, on l'installera via npm dans le setup

[tasks]
# --- SETUP & HELPERS ---
# On installe ce qui manque à conda-forge (Bun + Gemini)
setup = "npm install -g bun @google/gemini-cli"
clean = "./clean-branches.sh"
clone = "./sync-repos.sh --clone-only"
sync = "./sync-repos.sh"
env-clean = "node launcher/clean-env.mjs"
info = "git --version && echo To clean branches, run: pixi run clean"
mcp = "cd dev-agent-mcp && bun run src/index.ts"
mcp-test = "cd dev-agent-mcp && bun test"
mcp-build = "cd dev-agent-mcp && bun run build"
scalar = "cd api-aerial/src/docs && npx --yes @scalar/cli document serve openapi.yaml --watch --port 8088"
scalar-build = "cd api-aerial/src/docs && npx --yes @scalar/cli document validate openapi.yaml && node -e \"require('node:fs').copyFileSync('redoc.html', 'redoc-static.html')\""
sdk-generate = "cd api-aerial/src/docs && node -e \"require('node:fs').rmSync('../../../sdk/typescript-fetch', { recursive: true, force: true })\" && npx --yes @openapitools/openapi-generator-cli generate -i openapi.yaml -g typescript-fetch -o ../../../sdk/typescript-fetch --skip-validate-spec --global-property apiDocs=false,modelDocs=false"

# --- INSTALL / UPDATE DES DÉPENDANCES ---
# `npm install` synchronise node_modules ET met à jour le package-lock.json si package.json a changé.
# `npm ci` (install-ci) = strict, reproductible, ne touche jamais au lock.
# `npm update` (update-*) = monte les versions dans les ranges du package.json et réécrit le lock.
install-api-aerial = { cmd = "npm install --no-audit --no-fund", cwd = "api-aerial/src" }
update-api-aerial = { cmd = "npm update --no-audit --no-fund", cwd = "api-aerial/src" }
ci-api-aerial = { cmd = "npm ci --no-audit --no-fund", cwd = "api-aerial/src" }
install-api-dashboard = { cmd = "npm install --no-audit --no-fund", cwd = "api-dashboard/src" }
update-api-dashboard = { cmd = "npm update --no-audit --no-fund", cwd = "api-dashboard/src" }
ci-api-dashboard = { cmd = "npm ci --no-audit --no-fund", cwd = "api-dashboard/src" }
install-api-car = { cmd = "npm install --no-audit --no-fund", cwd = "api-car/src" }
update-api-car = { cmd = "npm update --no-audit --no-fund", cwd = "api-car/src" }
ci-api-car = { cmd = "npm ci --no-audit --no-fund", cwd = "api-car/src" }
install-api-hotel = { cmd = "npm install --no-audit --no-fund", cwd = "api-hotel/src" }
update-api-hotel = { cmd = "npm update --no-audit --no-fund", cwd = "api-hotel/src" }
ci-api-hotel = { cmd = "npm ci --no-audit --no-fund", cwd = "api-hotel/src" }
install-api-rail = { cmd = "npm install --no-audit --no-fund", cwd = "api-rail/src" }
update-api-rail = { cmd = "npm update --no-audit --no-fund", cwd = "api-rail/src" }
ci-api-rail = { cmd = "npm ci --no-audit --no-fund", cwd = "api-rail/src" }
install-front-resa = { cmd = "npm install --no-audit --no-fund", cwd = "front-reservation" }
update-front-resa = { cmd = "npm update --no-audit --no-fund", cwd = "front-reservation" }
ci-front-resa = { cmd = "npm ci --no-audit --no-fund", cwd = "front-reservation" }
install-front-dashboard = { cmd = "npm install --no-audit --no-fund", cwd = "front-dashboard/src" }
update-front-dashboard = { cmd = "npm update --no-audit --no-fund", cwd = "front-dashboard/src" }
ci-front-dashboard = { cmd = "npm ci --no-audit --no-fund", cwd = "front-dashboard/src" }
install = { depends-on = ["install-api-aerial", "install-api-dashboard", "install-api-car", "install-api-hotel", "install-api-rail", "install-front-resa", "install-front-dashboard"] }
update = { depends-on = ["update-api-aerial", "update-api-dashboard", "update-api-car", "update-api-hotel", "update-api-rail", "update-front-resa", "update-front-dashboard"] }
install-ci = { depends-on = ["ci-api-aerial", "ci-api-dashboard", "ci-api-car", "ci-api-hotel", "ci-api-rail", "ci-front-resa", "ci-front-dashboard"] }


# --- PROCESSES (équivalent de 'devenv up') ---
api-aerial = { cmd = "npm run dev", cwd = "api-aerial/src" }
# MCP Metis : URL locales des API métier (logs techniques, actualisation UETTR).
# Ports locaux : aerial 8080, dashboard 8081, hotel 8082, rail 8083, car 8084.
api-dashboard = { cmd = "npm run dev", cwd = "api-dashboard/src", env = { AERIAL_API_URL = "http://localhost:8080", HOTEL_API_URL = "http://localhost:8082", RAIL_API_URL = "http://localhost:8083", CAR_API_URL = "http://localhost:8084" } }
api-car = { cmd = "npm run dev", cwd = "api-car/src" }
api-hotel = { cmd = "npm run dev", cwd = "api-hotel/src" }
api-rail = { cmd = "npm run dev", cwd = "api-rail/src" }
front-resa = { cmd = "npm run dev", cwd = "front-reservation" }
front-dashboard = { cmd = "npm run dev", cwd = "front-dashboard/src" }

# `pixi run up` : installe les deps, retire les anciens .env.local MinIO (S3 preprod via les .env versionnés),
# puis ouvre le mini site http://localhost:4000 (api-dashboard + front-reservation démarrent d'office,
# les autres services se lancent à la demande depuis le site).
# `pixi run up-fast` : pareil sans passer par l'install.
up-fast = "node launcher/server.mjs"
# `pixi run dev-switch` : tous les sous-repos sur development (ff-only) + nettoyage des branches mergées.
# `pixi run dev` : dev-switch puis up.
dev-switch = "./dev-switch.sh"
dev = { depends-on = ["dev-switch", "up"] }
up = { depends-on = ["install", "env-clean", "up-fast"] }
